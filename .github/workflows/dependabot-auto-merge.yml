name: 'Auto-merge Dependabot PRs'

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge
    runs-on: ubuntu-latest
    # Checking the actor as well as the PR author skips runs triggered by
    # someone else pushing to a Dependabot branch.
    if: >
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor == 'dependabot[bot]'
    steps:
      - name: Approve PR
        run: gh pr review "$PR_URL" --approve --body 'Auto-approved Dependabot PR.'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

      # GitHub merges the PR once the required status checks pass.
      - name: Enable auto-merge
        run: gh pr merge "$PR_URL" --auto --squash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}

  stop-auto-merge:
    name: Stop auto-merge
    runs-on: ubuntu-latest
    # GitHub keeps auto-merge on when someone with write access pushes, so
    # their commits would otherwise merge without a second review.
    if: >
      github.event.action == 'synchronize' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.auto_merge
    steps:
      - name: Disable auto-merge
        run: gh pr merge "$PR_URL" --disable-auto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
